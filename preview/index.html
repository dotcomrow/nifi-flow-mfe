<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NiFi Flow MFE Preview</title>
    <style>
      :root {
        color-scheme: light;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
        --bg: #f8fafc;
        --text: #0f172a;
        --panel-bg: #ffffff;
        --panel-border: #cbd5e1;
        --muted: #64748b;
        --label: #475569;
        --input-bg: #ffffff;
        --input-border: #cbd5e1;
        --button-bg: #1d4ed8;
        --button-border: #1d4ed8;
        --button-text: #ffffff;
        --button-secondary-bg: #ffffff;
        --button-secondary-border: #94a3b8;
        --button-secondary-text: #0f172a;
      }
      :root[data-theme-mode-resolved="dark"] {
        color-scheme: dark;
        --bg: #0b1220;
        --text: #e2e8f0;
        --panel-bg: #111b2f;
        --panel-border: #334155;
        --muted: #94a3b8;
        --label: #cbd5e1;
        --input-bg: #0f172a;
        --input-border: #334155;
        --button-bg: #3b82f6;
        --button-border: #3b82f6;
        --button-text: #ffffff;
        --button-secondary-bg: #0f172a;
        --button-secondary-border: #475569;
        --button-secondary-text: #e2e8f0;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
      }
      .wrap {
        max-width: 1120px;
        margin: 0 auto;
        padding: 1rem;
        display: grid;
        gap: 1rem;
      }
      .panel {
        display: grid;
        gap: 0.65rem;
        padding: 0.9rem;
        border: 1px solid var(--panel-border);
        border-radius: 10px;
        background: var(--panel-bg);
      }
      .row {
        display: grid;
        gap: 0.35rem;
      }
      .row > label {
        font-size: 0.8rem;
        color: var(--label);
      }
      input,
      textarea,
      button {
        font: inherit;
      }
      input,
      textarea {
        border: 1px solid var(--input-border);
        border-radius: 8px;
        padding: 0.5rem 0.6rem;
        background: var(--input-bg);
        color: var(--text);
      }
      textarea {
        min-height: 5rem;
      }
      .heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
      }
      .actions {
        display: flex;
        gap: 0.5rem;
      }
      button {
        border: 1px solid var(--button-border);
        background: var(--button-bg);
        color: var(--button-text);
        border-radius: 8px;
        padding: 0.45rem 0.85rem;
        cursor: pointer;
      }
      button.secondary {
        border-color: var(--button-secondary-border);
        background: var(--button-secondary-bg);
        color: var(--button-secondary-text);
      }
      .host {
        min-height: 220px;
      }
      .muted {
        color: var(--muted);
        font-size: 0.82rem;
      }
      #authStatus[data-state="error"] {
        color: #b91c1c;
      }
      #authStatus[data-state="ok"] {
        color: #166534;
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <section class="panel">
        <div class="heading">
          <h1 style="margin:0; font-size: 1.1rem;">NiFi Flow MFE Local Preview</h1>
          <button id="themeToggle" class="secondary" type="button">Theme: Auto</button>
        </div>
        <p class="muted" style="margin:0;">
          Edit GraphQL endpoints and remount the module. The MFE sends a flow request payload and streams back results.
        </p>
        <div class="row">
          <label for="httpUrl">GraphQL HTTP URL</label>
          <input id="httpUrl" />
        </div>
        <div class="row">
          <label for="wsUrl">GraphQL WS URL</label>
          <input id="wsUrl" />
        </div>
        <div class="row">
          <label for="authToken">Auth Token (optional)</label>
          <input id="authToken" />
        </div>
        <div class="row">
          <label for="authGateway">Auth Gateway URL</label>
          <input id="authGateway" value="https://login.suncoast.systems" />
        </div>
        <div class="row">
          <label for="authAppSlug">Auth App Slug</label>
          <input id="authAppSlug" value="nifi-flow-mfe-dev" />
        </div>
        <div class="row">
          <label for="authCodeParam">Auth Code Query Param</label>
          <input id="authCodeParam" value="gateway_code" />
        </div>
        <div class="row">
          <label for="conversationId">Conversation Id (optional)</label>
          <input id="conversationId" />
        </div>
        <div class="actions">
          <button id="loginButton" type="button">Login</button>
          <button id="clearTokenButton" class="secondary" type="button">Clear Token</button>
          <button id="applyButton" type="button">Apply / Remount</button>
        </div>
        <p id="authStatus" class="muted" style="margin:0;"></p>
      </section>
      <section class="panel">
        <div id="host" class="host"></div>
      </section>
    </main>
    <script src="/dev-dist/preview/main.js"></script>
  </body>
  </html>
